<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Sadat Shafin | Frontend Developer</title>

  <meta
    name="description"
    content="Portfolio of Sadat Shafin — Frontend Developer specializing in React, Tailwind CSS, Framer Motion, JavaScript, and creating modern, high-performance web applications."
  />

  <meta
    name="keywords"
    content="Sadat Shafin, Frontend Developer, React Developer, JavaScript, Tailwind CSS, Portfolio, Bangladesh, Web Developer"
  />

  <meta name="author" content="Sadat Shafin" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />

  <!-- Canonical -->
  <link rel="canonical" href="https://sadatportfolio.vercel.app/" />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/images/logo2.png"
  />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sadatportfolio.vercel.app/" />
  <meta property="og:title" content="Sadat Shafin | Frontend Developer" />
  <meta
    property="og:description"
    content="Explore the portfolio of Sadat Shafin, showcasing premium React projects, modern UI design, animations, and full-stack development."
  />

  <!-- Replace with your preview image -->
  <meta
    property="og:image"
    content="https://sadatportfolio.vercel.app/images/preview.webp"
  />

  <meta property="og:site_name" content="Sadat Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="Sadat Shafin | Frontend Developer"
  />

  <meta
    name="twitter:description"
    content="Modern React Developer Portfolio featuring premium UI, animations, and high-performance web experiences."
  />

  <meta
    name="twitter:image"
    content="https://sadatportfolio.vercel.app/images/preview.webp"
  />

  <!-- Mobile -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sadat Portfolio" />

  <!-- Performance -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Allura&display=swap"
    rel="stylesheet"
  />

</head>
